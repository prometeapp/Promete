name: Upload to NuGet

on:
  push:
    tags:
      - 'core-*'
      - 'imgui-*'
      - 'web-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '擬似的なタグ名 (例: imgui-1.0.0)'
        required: true
      dry_run:
        description: 'nuget.org へ push せず、pack までで止める'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Resolve project from tag
      id: project
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        case "$TAG" in
          core-*)  echo "path=Promete" ;;
          imgui-*) echo "path=Promete.ImGui" ;;
          web-*)   echo "path=Promete.Web" ;;
          *)       echo "Unknown tag: $TAG" >&2; exit 1 ;;
        esac >> "$GITHUB_OUTPUT"

    - name: Generate nuget package.
      run: dotnet pack ${{ steps.project.outputs.path }} --configuration Release -o nupkg

    - name: Publish to nuget
      if: github.event_name == 'push' || !inputs.dry_run
      run: dotnet nuget push "nupkg/*.nupkg" -k "$NUGET_API_KEY" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Dry run (skip push)
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run
      run: |
        echo "dry-run: nuget.org へは push しません。生成されたパッケージ:"
        ls -l nupkg
