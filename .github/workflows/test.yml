# This workflow will build and test the .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Test

on:
  push:
    branches: [ "main", "master", "develop", "v2", "feature/**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # ハングしたときに既定の 6 時間を使い切らないための上限
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install OpenAL and audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenal1 pulseaudio
        # pulseaudio --start が fork したデーモンはステップの stdout を
        # 握ったまま残ることがあり、ランナーがパイプの閉じるのを待って
        # ハングする。セッションを切り離して fd を全部渡さないようにする。
        timeout 60 setsid pulseaudio --start --exit-idle-time=-1 </dev/null >/dev/null 2>&1
        timeout 10 pactl info \
          || echo "pulseaudio に接続できないが、OpenAL は null デバイスで続行する"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Promete.Test/Promete.Test.csproj

    - name: Build
      run: dotnet build Promete.Test/Promete.Test.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test Promete.Test/Promete.Test.csproj --no-build --verbosity normal --configuration Release
