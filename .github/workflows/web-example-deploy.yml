# Promete.Web.Example を AOT で publish し、Cloudflare Pages にデプロイする。
# 将来、ドキュメントサイトから iframe で埋め込む想定だが、今はスタンドアロンで公開するだけ。
#
# 必要な設定 (リポジトリの Settings > Secrets and variables > Actions):
#   secrets.CLOUDFLARE_API_TOKEN   : "Cloudflare Pages: Edit" 権限のある API トークン
#   secrets.CLOUDFLARE_ACCOUNT_ID  : アカウント ID
#   vars.CLOUDFLARE_PAGES_PROJECT  : Pages のプロジェクト名 (省略時は promete-web-example)
# Pages のプロジェクトは、初回に wrangler が自動で作る (production branch は master)。

name: Web Example Deploy

on:
  push:
    branches: [ "master" ]
    paths:
      - "Promete/**"
      - "Promete.Web/**"
      - "Promete.Web.Example/**"
      - "Promete.Example/**"
      - "Promete.SceneGen/**"
      - ".github/workflows/web-example-deploy.yml"
  workflow_dispatch:

# 同じブランチで走っている AOT ビルドは古いので捨てる
concurrency:
  group: web-example-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install wasm-tools workload
      run: dotnet workload install wasm-tools

    # Promete.Web の props により、Release では RunAOTCompilation が既定で有効になる
    - name: Publish (Release, AOT)
      run: >
        dotnet publish Promete.Web.Example/Promete.Web.Example.csproj
        --configuration Release
        --output out

    # Cloudflare が配信時に圧縮するので、事前圧縮ファイルは置かない (ファイル数とアップロード量の節約)。
    # Pages は 1 ファイル 25MiB までなので、超えていたらここで落として原因を分かりやすくする。
    - name: Prepare site
      run: |
        site=out/wwwroot
        for f in index.html main.js promete-assets.json; do
          test -f "$site/$f" || { echo "::error::$site/$f が無い"; exit 1; }
        done
        find "$site" \( -name '*.br' -o -name '*.gz' \) -delete
        big=$(find "$site" -type f -size +25M)
        if [ -n "$big" ]; then
          echo "::error::Cloudflare Pages の上限 (25MiB) を超えるファイルがある:"
          find "$site" -type f -size +25M -exec ls -lh {} \;
          exit 1
        fi
        du -sh "$site"
        find "$site" -type f -size +1M -exec ls -lh {} \;

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >
          pages deploy out/wwwroot
          --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'promete-web-example' }}
          --branch=master
          --commit-dirty=true
