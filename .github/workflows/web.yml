# Promete.Web のサンプルをビルドし、ブラウザ向けの成果物が作れることを確かめる。
# Web だけで壊れるもの (targets、トリミング、ネイティブのリンク) は、他の CI では検出できない。
# 実行時の確認 (ヘッドレスブラウザ) はしない。

name: Web Build

on:
  push:
    branches: [ "main", "master", "develop", "v2", "feature/**", "develop/**", "hotfix/**" ]
    paths-ignore: [ "Promete.Docs/**", "plugins/**", "**.md" ]
  pull_request:
    paths-ignore: [ "Promete.Docs/**", "plugins/**", "**.md" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Release の publish を 2 回 (Folder / Package) とテストを回すので、既定より長めにする
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # ネイティブのシムを Emscripten でリンクするために必要
    - name: Install wasm-tools workload
      run: dotnet workload install wasm-tools

    # dotnet run の経路。トリミングしないので、P/Invoke の表の生成 (PrometeWebPInvokeScanExclude) を確かめる
    - name: Build (Debug)
      run: dotnet build Promete.Web.Example/Promete.Web.Example.csproj --configuration Debug

    # 公開の経路。AOT は数分かかるので、ここではインタプリタで確かめる
    - name: Publish (Release)
      run: >
        dotnet publish Promete.Web.Example/Promete.Web.Example.csproj
        --configuration Release
        -p:RunAOTCompilation=false
        --output out

    - name: Check output
      run: |
        for f in index.html main.js promete-assets.json _content/Promete.Web/promete.js; do
          test -f "out/wwwroot/$f" || { echo "::error::out/wwwroot/$f が無い"; exit 1; }
        done
        ls out/wwwroot/_framework/dotnet.native.*.wasm
        # 参照先の Promete.Example (Release では Package) のアセットは、wwwroot の外も含めて publish に残ってはいけない
        leaked=$(find out \( -name 'Promete.Example.*.prmtpak' -o -name 'Promete.Example.promete-assets.json' \))
        test -z "$leaked" || { echo "::error::参照先の Promete.Example のアセットが publish に残っている: $leaked"; exit 1; }

    # Package モードの公開。パッケージは wwwroot の直下に置かれ、wwwroot/assets は作られない
    - name: Publish (Release, Package)
      run: >
        dotnet publish Promete.Web.Example/Promete.Web.Example.csproj
        --configuration Release
        -p:RunAOTCompilation=false
        -p:PrometeAssetMode=Package
        --output out-package

    - name: Check package output
      run: |
        test -f out-package/wwwroot/Promete.Web.Example.main.prmtpak || { echo "::error::Promete.Web.Example.main.prmtpak が無い"; exit 1; }
        test ! -e out-package/wwwroot/assets || { echo "::error::Package モードなのに wwwroot/assets がある"; exit 1; }
        grep -q '"kind":"package"' out-package/wwwroot/promete-assets.json || { echo "::error::promete-assets.json に package の項目が無い"; exit 1; }
        leaked=$(find out-package \( -name 'Promete.Example.*.prmtpak' -o -name 'Promete.Example.promete-assets.json' \))
        test -z "$leaked" || { echo "::error::参照先の Promete.Example のアセットが publish に残っている: $leaked"; exit 1; }

    # Web の MSBuild 統合テスト。wasm-tools のワークロードを入れたこの環境で回す
    - name: Test (MSBuild integration, Web)
      run: dotnet test Promete.Test/Promete.Test.csproj --configuration Release --verbosity normal --filter "Category=MSBuild&FullyQualifiedName~AssetsBuildWebTests"
